<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Analytics Dashboard</title>

<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
  color: white;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

h2 {
  text-align: center;
  margin: 25px 10px;
  font-size: 24px;
}

.container {
  width: 95%;
  max-width: 950px;
  margin: auto;
  padding-bottom: 40px;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  margin: 18px 0;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}

/* GRID STYLE */
.personRow {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 10px 0;
}

.personBox {
  min-width: 90px;
  text-align: center;
  padding: 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.12);
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 10px 0 20px;
}

.tabs button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: rgba(255,255,255,0.15);
  color: white;
}

.tabs button.active {
  background: #667eea;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

canvas {
  background: rgba(255,255,255,0.95);
  border-radius: 12px;
  padding: 10px;
  margin-top: 12px;
}
</style>
</head>

<body>

<h2>📊 Teacher Support Survey Analytics</h2>

<div class="tabs">
  <button class="active" onclick="showTab('charts')">Charts</button>
  <button onclick="showTab('table')">Table</button>
  <button onclick="showTab('why')">Why Answers</button>
</div>

<div class="container">

<!-- CHARTS -->
<div id="charts" class="section active">
  <div class="card">
    <h3>Charts Section (unchanged)</h3>
    <canvas id="q1"></canvas>
    <canvas id="q2"></canvas>
    <canvas id="q3"></canvas>
    <canvas id="q4"></canvas>
    <canvas id="q5"></canvas>
  </div>
</div>

<!-- TABLE (NEW GRID VIEW) -->
<div id="table" class="section">
  <div class="card">
    <h3>📊 Question Wise Responses</h3>
    <div id="gridView"></div>
  </div>
</div>

<!-- WHY -->
<div id="why" class="section">
  <div class="card">
    <h3>Why Answers Section (unchanged)</h3>
    <div id="whyMotivation"></div>
    <div id="whyFocus"></div>
    <div id="whyConfidence"></div>
    <div id="whyEngagement"></div>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyBorukwZKOeJaxEYqY57zL1W-8zjevQlhg",
authDomain:"messages-9e5da.firebaseapp.com",
databaseURL:"https://messages-9e5da-default-rtdb.firebaseio.com",
projectId:"messages-9e5da",
storageBucket:"messages-9e5da.firebasestorage.app",
messagingSenderId:"1033254869246",
appId:"1:1033254869246:web:4c2b01a374c85ca509adaf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.showTab = function(tab){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(tab).classList.add("active");
event.target.classList.add("active");
};

onValue(ref(db,"responses"), snap=>{
const list = Object.values(snap.val() || {});

const yesNo = v => v==="Yes" ? "👍 Yes" : "👎 No";
const helpMap = {
Never:"❌ Never",
Sometimes:"🙂 Sometimes",
Often:"🔥 Often",
Always:"🚀 Always"
};

let html = "";

/* Q1 */
html += `<div class="card"><h3>Q1 Support</h3><div class="personRow">`;
list.forEach(d=>{
html += `<div class="personBox">${d.support || "-"}</div>`;
});
html += `</div></div>`;

/* Q2 */
html += `<div class="card"><h3>Q2 Motivation</h3><div class="personRow">`;
list.forEach(d=>{
html += `<div class="personBox">${yesNo(d.motivation)}</div>`;
});
html += `</div></div>`;

/* Q3 */
html += `<div class="card"><h3>Q3 Help</h3><div class="personRow">`;
list.forEach(d=>{
html += `<div class="personBox">${helpMap[d.help] || d.help}</div>`;
});
html += `</div></div>`;

/* Q4 */
html += `<div class="card"><h3>Q4 Focus</h3><div class="personRow">`;
list.forEach(d=>{
html += `<div class="personBox">${yesNo(d.focus)}</div>`;
});
html += `</div></div>`;

/* Q5 */
html += `<div class="card"><h3>Q5 Confidence</h3><div class="personRow">`;
list.forEach(d=>{
html += `<div class="personBox">${yesNo(d.confidence)}</div>`;
});
html += `</div></div>`;

/* Q6 */
html += `<div class="card"><h3>Q6 Engagement</h3><div class="personRow">`;
list.forEach(d=>{
html += `<div class="personBox">${yesNo(d.engagement)}</div>`;
});
html += `</div></div>`;

document.getElementById("gridView").innerHTML = html;

});
</script>

</body>
</html>
