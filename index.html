<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychology Survey</title>

<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', 'Poppins', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  background: linear-gradient(-45deg, #667eea, #764ba2, #6a85f1, #5f9cff);
  background-size: 400% 400%;
  animation: bgShift 15s ease infinite;
}

/* smoother gradient motion */
@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* emoji rain */
.emoji {
  position: fixed;
  top: -20px;
  font-size: 22px;
  animation: fall linear forwards;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.85;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

/* card depth upgrade */
.form-card {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 18px;
  width: 90%;
  max-width: 650px;
  margin: 40px auto;
  box-shadow:
    0 20px 40px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.6);
  transform: translateY(0);
  transition: 0.3s ease;
}

.form-card:hover {
  transform: translateY(-3px);
}

h2 {
  text-align: center;
  font-weight: 700;
  color: #2b2b2b;
  letter-spacing: 0.5px;
}

.question {
  margin-bottom: 18px;
}

label {
  font-weight: 600;
  color: #333;
}

select, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 6px;
  outline: none;
  transition: 0.2s;
}

select:focus, textarea:focus {
  border-color: #667eea;
  box-shadow: 0 0 8px rgba(102,126,234,0.3);
}

textarea {
  resize: none;
  height: 60px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  transition: 0.3s;
}

button:hover {
  transform: scale(1.02);
}

.hidden { display: none; }

/* THANK YOU MODAL */
#thankYouCard {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.7);
  background: white;
  padding: 30px 40px;
  border-radius: 16px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.3);
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  opacity: 0;
  transition: 0.4s ease;
  z-index: 10000;
}

#thankYouCard.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<div class="form-card">
<h2>🎓 Teacher Support Survey</h2>

<form id="surveyForm">

<div class="question">
<label>1. On a scale of 1-4, how much support (help/feedback) do you feel you receive from your teachers?</label>
<select id="support">
<option value="1">Very Little</option>
<option value="2">Some</option>
<option value="3">Sufficient</option>
<option value="4">High Support</option>
</select>
</div>

<div class="question">
<label>2. Do you feel more motivated to study a subject when the teacher provides regular encouragement? (Yes / No)</label>
<select id="motivation">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="motivationWhy" class="hidden" placeholder="If No, why?"></textarea>
</div>

<div class="question">
<label>3. How often do you ask your teacher for help when you don't understand a topic?</label>
<select id="help">
<option>Never</option>
<option>Sometimes</option>
<option>Often</option>
<option>Always</option>
</select>
</div>

<div class="question">
<label>4. Do you think teacher support (e.g., clear feedback) improves your ability to focus and learn? (Yes / No)</label>
<select id="focus">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="focusWhy" class="hidden" placeholder="If No, why?"></textarea>
</div>

<div class="question">
<label>5. Have you ever felt more confident in an exam because of a teacher's encouragement? (Yes / No)</label>
<select id="confidence">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="confidenceWhy" class="hidden" placeholder="If No, why?"></textarea>
</div>

<div class="question">
<label>6. Would you be more engaged in class if teachers provided more interactive feedback? (Yes / No)</label>
<select id="engagement">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="engagementWhy" class="hidden" placeholder="If No, why?"></textarea>
</div>

<button type="submit">Submit</button>

</form>
</div>

<!-- THANK YOU CARD -->
<div id="thankYouCard">🙏 Thank you for your contribution putha!</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyBorukwZKOeJaxEYqY57zL1W-8zjevQlhg",
authDomain:"messages-9e5da.firebaseapp.com",
databaseURL:"https://messages-9e5da-default-rtdb.firebaseio.com",
projectId:"messages-9e5da",
storageBucket:"messages-9e5da.firebasestorage.app",
messagingSenderId:"1033254869246",
appId:"1:1033254869246:web:4c2b01a374c85ca509adaf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function setup(selectId, textId){
const s = document.getElementById(selectId);
const t = document.getElementById(textId);

s.addEventListener("change", () => {
if(s.value === "No"){
t.classList.remove("hidden");
}else{
t.classList.add("hidden");
t.value = "";
}
});
}

setup("motivation","motivationWhy");
setup("focus","focusWhy");
setup("confidence","confidenceWhy");
setup("engagement","engagementWhy");

/* emoji rain */
const emojis = ["🎓","📚","✏️","🧑‍🏫","📖","📝","🔬","🏫","📆","✂️","📗","🧑‍🏫"];

function dropEmoji(){
const e = document.createElement("div");
e.classList.add("emoji");
e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
e.style.left = Math.random()*100 + "vw";
e.style.animationDuration = (3 + Math.random()*3) + "s";
document.body.appendChild(e);

setTimeout(()=> e.remove(), 6000);
}
setInterval(dropEmoji, 400);

/* submit handler */
document.getElementById("surveyForm").onsubmit = function(e){
e.preventDefault();

push(ref(db,"responses"),{
support: document.getElementById("support").value,
motivation: document.getElementById("motivation").value,
motivationWhy: document.getElementById("motivationWhy").value,
help: document.getElementById("help").value,
focus: document.getElementById("focus").value,
focusWhy: document.getElementById("focusWhy").value,
confidence: document.getElementById("confidence").value,
confidenceWhy: document.getElementById("confidenceWhy").value,
engagement: document.getElementById("engagement").value,
engagementWhy: document.getElementById("engagementWhy").value,
time: new Date().toLocaleString()
});

document.getElementById("surveyForm").reset();

/* show thank you card */
const card = document.getElementById("thankYouCard");
card.classList.add("show");

setTimeout(()=> {
card.classList.remove("show");
}, 3000);

alert("Submitted!");
};
</script>

</body>
</html>
