<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Support Survey</title>

<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', 'Poppins', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  background: linear-gradient(-45deg, #667eea, #764ba2, #6a85f1, #5f9cff);
  background-size: 400% 400%;
  animation: bgShift 15s ease infinite;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.emoji {
  position: fixed;
  top: -20px;
  font-size: 22px;
  animation: fall linear forwards;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.85;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

.form-card {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 18px;
  width: 90%;
  max-width: 650px;
  margin: 40px auto;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

h2 {
  text-align: center;
  font-weight: 700;
  color: #2b2b2b;
}

.question { margin-bottom: 22px; }

label {
  font-weight: 600;
  color: #333;
  line-height: 1.4em;
}

select, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 8px;
}

textarea { height: 60px; resize: none; }

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.hidden { display: none; }

/* THANK YOU CARD */
#thankYouCard {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.7);
  background: white;
  padding: 30px 40px;
  border-radius: 16px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.3);
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  opacity: 0;
  transition: 0.4s ease;
  z-index: 10000;
}

#thankYouCard.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: 0;
  z-index: 9999;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="form-card">
<h2>🎓 Teacher Support Survey</h2>

<form id="surveyForm">

<div class="question">
<label>
1. On a scale of 1–4, how much support do you feel you receive from your teachers?
<br>
</label>
<select id="support">
<option value="1">1 Very Little</option>
<option value="2">2 Some</option>
<option value="3">3 Sufficient</option>
<option value="4">4 High Support</option>
</select>
</div>

<div class="question">
<label>
2. Do you feel more motivated to study a subject when the teacher provides regular encouragement?
<br>(Yes / No)
</label>
<select id="motivation">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="motivationWhy" class="hidden"></textarea>
</div>

<div class="question">
<label>
3. How often do you ask your teacher for help when you don't understand a topic?
<br>(Never, Sometimes, Often, Always)
</label>
<select id="help">
<option>Never</option>
<option>Sometimes</option>
<option>Often</option>
<option>Always</option>
</select>
</div>

<div class="question">
<label>
4. Do you think teacher support (e.g., clear feedback) improves your ability to focus and learn?
<br>(Yes / No, please explain why)
</label>
<select id="focus">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="focusWhy" class="hidden"></textarea>
</div>

<div class="question">
<label>
5. Have you ever felt more confident in an exam because of a teacher's encouragement?
<br>(Yes / No)
</label>
<select id="confidence">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="confidenceWhy" class="hidden"></textarea>
</div>

<div class="question">
<label>
6. Would you be more engaged in class if teachers provided more interactive feedback?
<br>(Yes / No, please explain why)
</label>
<select id="engagement">
<option>Yes</option>
<option>No</option>
</select>
<textarea id="engagementWhy" class="hidden"></textarea>
</div>

<button type="submit">Submit</button>

</form>
</div>

<div id="thankYouCard">🙏 Thank you for your contribution putha!</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyBorukwZKOeJaxEYqY57zL1W-8zjevQlhg",
authDomain:"messages-9e5da.firebaseapp.com",
databaseURL:"https://messages-9e5da-default-rtdb.firebaseio.com",
projectId:"messages-9e5da",
storageBucket:"messages-9e5da.firebasestorage.app",
messagingSenderId:"1033254869246",
appId:"1:1033254869246:web:4c2b01a374c85ca509adaf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function launchConfetti(){
const colors = ["#667eea","#764ba2","#ffffff","#ffcc00","#ff6b6b"];

for(let i=0;i<80;i++){
const c = document.createElement("div");
c.classList.add("confetti");
c.style.left = Math.random()*100 + "vw";
c.style.background = colors[Math.floor(Math.random()*colors.length)];
c.style.animationDuration = (2 + Math.random()*2) + "s";
document.body.appendChild(c);

setTimeout(()=>c.remove(),4000);
}
}

function setup(selectId, textId){
const s = document.getElementById(selectId);
const t = document.getElementById(textId);

s.addEventListener("change", () => {
if(s.value === "No"){
t.classList.remove("hidden");
}else{
t.classList.add("hidden");
t.value = "";
}
});
}

setup("motivation","motivationWhy");
setup("focus","focusWhy");
setup("confidence","confidenceWhy");
setup("engagement","engagementWhy");

document.getElementById("surveyForm").onsubmit = function(e){
e.preventDefault();

push(ref(db,"responses"),{
support: document.getElementById("support").value,
motivation: document.getElementById("motivation").value,
motivationWhy: document.getElementById("motivationWhy").value,
help: document.getElementById("help").value,
focus: document.getElementById("focus").value,
focusWhy: document.getElementById("focusWhy").value,
confidence: document.getElementById("confidence").value,
confidenceWhy: document.getElementById("confidenceWhy").value,
engagement: document.getElementById("engagement").value,
engagementWhy: document.getElementById("engagementWhy").value,
time: new Date().toLocaleString()
});

document.getElementById("surveyForm").reset();
document.getElementById("thankYouCard").classList.add("show");
launchConfetti();
};
</script>

</body>
</html>
